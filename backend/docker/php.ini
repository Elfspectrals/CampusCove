; Production overrides on top of php.ini-production.
expose_php = Off
memory_limit = 256M
; Admin uploads skin models up to 50 MB (AdminShopItemController).
upload_max_filesize = 50M
post_max_size = 55M

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Code is baked into the image: never stat files again.
opcache.validate_timestamps = 0
