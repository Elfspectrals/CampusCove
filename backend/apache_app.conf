# Included by heroku-php-apache2 (-C) inside the buildpack's <VirtualHost>; replaces its default include.
DirectoryIndex index.php index.html index.htm

# The buildpack answers 403 to any dotfile (/.env, /.git/config...) before PHP runs, so Laravel never logs
# those probes. A server-level rewrite runs before that access check: send them to the front controller,
# which logs the probe and answers 404. No real dotfile is ever served. /.well-known stays untouched.
RewriteEngine On
RewriteRule "^/(.*/)?\.(?!well-known(/|$))" "${DOCUMENT_ROOT}/index.php" [L]
